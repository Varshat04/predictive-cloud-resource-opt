<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resource Optimizer | Secure Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            color: #e4e4e7;
        }
        .glass-card {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #1f1f23;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }
        input, select {
            background: #0a0a0a !important;
            border: 1px solid #27272a !important;
            color: white !important;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #10b981 !important;
            outline: none;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .hidden-form { display: none; }
    </style>
</head>
<body class="flex h-screen items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-10 rounded-2xl relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="flex justify-center items-center gap-3 mb-2">
                <div class="w-1.5 h-8 bg-emerald-500 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.6)]"></div>
                <div class="text-left leading-none">
                    <span class="text-[10px] font-bold text-zinc-500 tracking-[0.25em] uppercase">Cloud Resource</span><br>
                    <span class="text-2xl font-black text-white tracking-tighter uppercase italic">Optimizer</span>
                </div>
            </div>
            <p id="form-subtitle" class="text-[10px] text-zinc-500 uppercase tracking-widest mt-4 font-bold">Authentication Gateway</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-2 tracking-widest">User Identity</label>
                <input type="text" id="login-user" class="w-full px-4 py-3 rounded-lg text-sm mono font-medium" placeholder="Enter ID (e.g., admin_01)" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-2 tracking-widest">Security Key</label>
                <input type="password" id="login-pass" class="w-full px-4 py-3 rounded-lg text-sm mono font-medium" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-black py-3.5 rounded-lg text-[11px] uppercase tracking-[0.2em] transition-all shadow-lg flex justify-center items-center gap-2">
                <span id="login-btn-text">Verify & Enter</span>
            </button>
            <p class="text-center text-[11px] text-zinc-500">
                New authorized personnel? 
                <a href="#" onclick="toggleForms()" class="text-emerald-500 font-bold hover:underline">Register Instance</a>
            </p>
        </form>

        <form id="register-form" class="space-y-4 hidden-form">
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1 tracking-widest">Full Name</label>
                <input type="text" id="reg-name" class="w-full px-4 py-2.5 rounded-lg text-sm" placeholder="e.g. John Doe" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1 tracking-widest">Assign User ID</label>
                <input type="text" id="reg-user" class="w-full px-4 py-2.5 rounded-lg text-sm mono" placeholder="e.g. user_02" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1 tracking-widest">System Role</label>
                <select id="reg-role" class="w-full px-4 py-2.5 rounded-lg text-sm font-bold uppercase tracking-widest">
                    <option value="VIEWER">System Viewer</option>
                    <option value="ADMIN">Root Administrator</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1 tracking-widest">Set Password</label>
                <input type="password" id="reg-pass" class="w-full px-4 py-2.5 rounded-lg text-sm mono" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-white text-black font-black py-3.5 rounded-lg text-[11px] uppercase tracking-[0.2em] transition-all hover:bg-zinc-200">Create Identity</button>
            <p class="text-center text-[11px] text-zinc-500">
                Already registered? 
                <a href="#" onclick="toggleForms()" class="text-emerald-500 font-bold hover:underline">Return to Login</a>
            </p>
        </form>

        <div id="msg-box" class="hidden mt-4 p-3 rounded-lg text-center text-[10px] font-bold uppercase tracking-widest border"></div>
    </div>

    <script>
        // BACKEND URL - (Vercel/Render par deploy karte waqt ise Render URL se replace kar dena)
        const API_BASE = "http://127.0.0.1:5000/api";

        function toggleForms() {
            document.getElementById('login-form').classList.toggle('hidden-form');
            document.getElementById('register-form').classList.toggle('hidden-form');
            const sub = document.getElementById('form-subtitle');
            sub.innerText = sub.innerText.includes('Authentication') ? 'Module 1: User Registration' : 'Module 1: Authentication Gateway';
        }

        function showMsg(text, isError) {
            const box = document.getElementById('msg-box');
            box.innerText = text;
            box.className = isError ? 
                'mt-4 p-3 rounded-lg text-center text-[10px] font-bold uppercase tracking-widest border border-red-500/20 bg-red-500/10 text-red-500' : 
                'mt-4 p-3 rounded-lg text-center text-[10px] font-bold uppercase tracking-widest border border-emerald-500/20 bg-emerald-500/10 text-emerald-500';
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3000);
        }

        // HANDLE LOGIN
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btnText = document.getElementById('login-btn-text');
            btnText.innerText = "Authenticating...";

            const payload = {
                user_id: document.getElementById('login-user').value,
                password: document.getElementById('login-pass').value
            };

            fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                btnText.innerText = "Verify & Enter";
                if(data.status === 'success') {
                    // Save to local storage ONLY for dashboard UI text
                    localStorage.setItem('opt_user_name', data.name);
                    localStorage.setItem('opt_user_role', data.role);
                    showMsg('Access Granted. Redirecting...', false);
                    setTimeout(() => window.location.href = "index.html", 1000);
                } else {
                    showMsg(data.message, true);
                }
            })
            .catch(err => {
                btnText.innerText = "Verify & Enter";
                showMsg('Backend Server Offline', true);
            });
        });

        // HANDLE REGISTRATION
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('reg-name').value,
                user_id: document.getElementById('reg-user').value,
                role: document.getElementById('reg-role').value,
                password: document.getElementById('reg-pass').value
            };

            fetch(`${API_BASE}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    showMsg(data.message, false);
                    document.getElementById('register-form').reset();
                    setTimeout(() => toggleForms(), 1500);
                } else {
                    showMsg(data.message, true);
                }
            })
            .catch(err => showMsg('Backend Server Offline', true));
        });
    </script>
</body>
</html>
